[project]
name = "lazyapk"
version = "1.0.0"
description = "A toolbox of practical ADB and Frida commands"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "pyaxmlparser>=0.3.31",
]

[project.scripts]
lazyapk = "lazyapk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
